apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-deployment
  labels:
    app: billing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: billing
  template:
    metadata:
      labels:
        app: billing
    spec:
      containers:
      - name: billing-container
        # Replace 'yourdockerusername' with your actual Docker Hub username
        image: keerthini2986/shopping-bill:PLACEHOLDER_TAG
        ports:
        - containerPort: 80